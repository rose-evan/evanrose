<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#dbe9ff">
  <title>Evan Rose</title>
  <meta name="description" content="Evan Rose — recommendations and ways to say hello.">
  <meta name="robots" content="index,follow">
  <link rel="icon" href="data:,">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      color-scheme: light;
      --ink: #10131a;
      --copy: #505968;
      --quiet: #657080;
      --accent: #3267f2;
      --snow: #f7faff;
      --glacier: #b9d8ff;
      --meltwater: #bcecdf;
      --glass: rgba(255, 255, 255, 0.72);
      --glass-soft: rgba(255, 255, 255, 0.54);
      --glass-line: rgba(255, 255, 255, 0.72);
      --hairline: rgba(16, 19, 26, 0.1);
      --shadow: rgba(24, 52, 112, 0.22);
      --pointer-x: 68%;
      --pointer-y: 28%;
    }

    html {
      min-height: 100%;
      background: #dbe9ff;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.5;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    body {
      position: relative;
      isolation: isolate;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: clamp(1rem, 6vw, 5.625rem);
      overflow-x: hidden;
      background: #dbe9ff;
      transition: color 500ms ease, background-color 500ms ease;
    }

    button, a { font: inherit; }

    [hidden] { display: none !important; }

    button { color: inherit; }

    a { color: inherit; }

    .gradient-field {
      position: fixed;
      z-index: 0;
      inset: -10vmax;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 12%, var(--snow) 0 18%, transparent 43%),
        radial-gradient(circle at 82% 22%, var(--meltwater) 0 12%, var(--glacier) 34%, transparent 62%),
        radial-gradient(circle at 48% 110%, var(--accent) 0, #7aa7ff 30%, var(--snow) 68%);
      transform: translateZ(0);
    }

    .gradient-field::before {
      content: "";
      position: absolute;
      inset: -18%;
      background:
        radial-gradient(circle at var(--pointer-x) var(--pointer-y), rgba(244, 255, 252, 0.96) 0 6%, rgba(188, 236, 223, 0.72) 14%, transparent 35%),
        conic-gradient(from 118deg at 48% 58%, rgba(50, 103, 242, 0.12), rgba(255, 255, 255, 0.62), rgba(188, 236, 223, 0.24), rgba(50, 103, 242, 0.12));
      filter: blur(34px) saturate(1.12);
      animation: field-drift 18s ease-in-out infinite alternate;
      will-change: transform;
    }

    .gradient-field::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(16, 19, 26, 0.34) 0.55px, transparent 0.7px);
      background-size: 4px 4px;
      opacity: 0.17;
      -webkit-mask-image: radial-gradient(circle at var(--pointer-x) var(--pointer-y), #000 0 16%, rgba(0, 0, 0, 0.7) 30%, transparent 62%);
      mask-image: radial-gradient(circle at var(--pointer-x) var(--pointer-y), #000 0 16%, rgba(0, 0, 0, 0.7) 30%, transparent 62%);
      transition: opacity 500ms ease;
    }

    .current {
      position: absolute;
      border-radius: 50%;
      filter: blur(44px);
      will-change: transform;
    }

    .current--cobalt {
      left: -10%;
      bottom: -38%;
      width: 82%;
      height: 70%;
      opacity: 0.88;
      background: linear-gradient(112deg, #3267f2 0%, #7fa9ff 56%, #bcecdf 100%);
      animation: cobalt-current 15s ease-in-out infinite alternate;
    }

    .current--mint {
      top: -31%;
      right: -14%;
      width: 64%;
      height: 68%;
      opacity: 0.72;
      background: radial-gradient(circle at 44% 50%, #e9fff8 0%, #bcecdf 38%, #75a6ff 74%, transparent 100%);
      animation: mint-current 17s ease-in-out infinite alternate;
    }

    @keyframes field-drift {
      from { transform: rotate(-3deg) scale(1); }
      to { transform: rotate(4deg) scale(1.08) translate3d(1.5%, -1%, 0); }
    }

    @keyframes cobalt-current {
      from { transform: rotate(-10deg) translate3d(-2%, 3%, 0); }
      to { transform: rotate(-4deg) translate3d(8%, -5%, 0) scale(1.08); }
    }

    @keyframes mint-current {
      from { transform: rotate(14deg) translate3d(0, 0, 0); }
      to { transform: rotate(4deg) translate3d(-11%, 9%, 0) scale(1.12); }
    }

    .glass {
      position: relative;
      z-index: 1;
      width: min(70rem, calc(100vw - clamp(2rem, 12vw, 10rem)));
      min-height: min(45rem, calc(100svh - clamp(2rem, 12vw, 10rem)));
      display: flex;
      flex-direction: column;
      padding: clamp(2rem, 5vw, 4rem) clamp(1.5rem, 5.5vw, 4.5rem);
      overflow: hidden;
      isolation: isolate;
      border: 1px solid var(--glass-line);
      border-radius: 1.75rem;
      background: var(--glass);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8), 0 2.25rem 5.625rem var(--shadow);
      -webkit-backdrop-filter: blur(30px) saturate(1.12);
      backdrop-filter: blur(30px) saturate(1.12);
      transition: background-color 500ms ease, border-color 500ms ease, box-shadow 500ms ease;
    }

    .glass::before {
      content: "";
      position: absolute;
      z-index: -1;
      top: -7rem;
      right: -6rem;
      width: 32rem;
      height: 25rem;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(50, 103, 242, 0.08), transparent 68%);
      transform: translate(calc((var(--pointer-x) - 50%) * 0.08), calc((var(--pointer-y) - 50%) * 0.08));
      transition: transform 240ms ease-out;
    }

    .glass::after {
      content: "";
      position: absolute;
      z-index: 0;
      inset: 0;
      background-image: radial-gradient(rgba(16, 19, 26, 0.36) 0.55px, transparent 0.72px);
      background-size: 4px 4px;
      opacity: 0.09;
      pointer-events: none;
      -webkit-mask-image: radial-gradient(circle at var(--pointer-x) var(--pointer-y), #000 0 14%, rgba(0, 0, 0, 0.64) 28%, transparent 58%);
      mask-image: radial-gradient(circle at var(--pointer-x) var(--pointer-y), #000 0 14%, rgba(0, 0, 0, 0.64) 28%, transparent 58%);
      transition: opacity 500ms ease;
    }

    .glass > * {
      position: relative;
      z-index: 1;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      color: var(--ink);
      text-decoration: none;
    }

    .brand-mark {
      width: 2.125rem;
      height: 2.125rem;
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 50%;
      background: var(--ink);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      transition: background-color 500ms ease, color 500ms ease;
    }

    .brand-label {
      font-size: 0.8125rem;
      font-weight: 650;
      letter-spacing: -0.01em;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .control {
      width: 2.5rem;
      height: 2.5rem;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid var(--hairline);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.66);
      cursor: pointer;
      transition: transform 180ms ease, background-color 180ms ease, border-color 500ms ease;
    }

    .control:hover { transform: translateY(-2px); background: rgba(255, 255, 255, 0.9); }

    .control:active { transform: translateY(0) scale(0.96); }

    .control:focus-visible,
    .recommendation:focus-visible,
    .contact-link:focus-visible,
    .brand:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .control svg { width: 1rem; height: 1rem; }

    .hero {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      padding-top: clamp(4.75rem, 10vw, 6.375rem);
    }

    .eyebrow {
      margin: 0;
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 750;
      letter-spacing: 0.12em;
      line-height: 1rem;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--ink);
      font-size: clamp(3.5rem, 7.2vw, 4.75rem);
      font-weight: 650;
      letter-spacing: -0.055em;
      line-height: 1;
    }

    .intro {
      max-width: 32rem;
      margin: 0;
      color: var(--copy);
      font-size: clamp(1rem, 1.6vw, 1.125rem);
      letter-spacing: -0.015em;
      line-height: 1.5;
    }

    .lower {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 3rem;
      margin-top: auto;
      padding-top: clamp(4rem, 9vw, 5.5rem);
    }

    .recommendation-wrap {
      width: min(40.625rem, 100%);
    }

    .section-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.875rem;
      color: var(--copy);
      font-size: 0.75rem;
      font-weight: 750;
      letter-spacing: 0.1em;
      line-height: 1rem;
      text-transform: uppercase;
    }

    .count {
      color: #7a8492;
      font-weight: 500;
      letter-spacing: 0;
    }

    .recommendation {
      min-height: 5.75rem;
      display: flex;
      align-items: center;
      gap: 1.25rem;
      padding: 1.125rem 1.25rem;
      border: 1px solid var(--hairline);
      border-radius: 1.125rem;
      background: var(--glass-soft);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.76);
      text-decoration: none;
      transition: transform 220ms ease, background-color 220ms ease, border-color 500ms ease;
    }

    .recommendation:hover { transform: translateY(-3px); background: rgba(255, 255, 255, 0.76); }

    .play {
      width: 3rem;
      height: 3rem;
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 50%;
      background: var(--ink);
      color: #fff;
      transition: background-color 500ms ease, color 500ms ease;
    }

    .play svg { width: 0.9375rem; height: 1.0625rem; transform: translateX(1px); }

    .recommendation-copy {
      min-width: 0;
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      gap: 0.25rem;
    }

    .recommendation-title {
      color: var(--ink);
      font-size: 1.0625rem;
      font-weight: 650;
      letter-spacing: -0.02em;
      line-height: 1.375rem;
    }

    .recommendation-note {
      color: var(--quiet);
      font-size: 0.8125rem;
      line-height: 1.125rem;
    }

    .arrow { width: 2rem; flex: 0 0 2rem; text-align: center; font-size: 1rem; }

    .contacts {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 0.5rem;
    }

    .contact-link {
      height: 2.75rem;
      min-width: 2.75rem;
      display: grid;
      place-items: center;
      padding: 0 1.125rem;
      border: 1px solid var(--hairline);
      border-radius: 1.375rem;
      background: var(--glass-soft);
      color: var(--ink);
      font-size: 0.8125rem;
      font-weight: 650;
      text-decoration: none;
      transition: transform 180ms ease, background-color 180ms ease, border-color 500ms ease;
    }

    .contact-link--round { width: 2.75rem; padding: 0; border-radius: 50%; }

    .contact-link:hover { transform: translateY(-2px); background: rgba(255, 255, 255, 0.76); }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    body[data-theme="night"] {
      color-scheme: dark;
      --ink: #f7faff;
      --copy: #d5def0;
      --quiet: #aebbd1;
      --accent: #8bb0ff;
      --snow: #080c18;
      --glacier: #17346e;
      --meltwater: #185c63;
      --glass: rgba(8, 13, 27, 0.64);
      --glass-soft: rgba(10, 18, 36, 0.5);
      --glass-line: rgba(255, 255, 255, 0.16);
      --hairline: rgba(255, 255, 255, 0.14);
      --shadow: rgba(0, 0, 0, 0.42);
      background: #070b17;
    }

    body[data-theme="night"] .control,
    body[data-theme="night"] .recommendation,
    body[data-theme="night"] .contact-link { background: rgba(10, 18, 36, 0.52); }

    body[data-theme="night"] .control:hover,
    body[data-theme="night"] .recommendation:hover,
    body[data-theme="night"] .contact-link:hover { background: rgba(24, 40, 74, 0.72); }

    body[data-theme="night"] .brand-mark,
    body[data-theme="night"] .play { background: #f7faff; color: #10131a; }

    body.motion-paused .gradient-field::before,
    body.motion-paused .current { animation-play-state: paused; }

    body.motion-paused .gradient-field::after { opacity: 0.08; }

    body.motion-paused .glass::after { opacity: 0.035; }

    @media (max-width: 64rem) {
      .glass { width: min(100%, 52rem); min-height: min(45rem, calc(100svh - 2rem)); }
      .lower { align-items: stretch; flex-direction: column; gap: 1.5rem; }
      .recommendation-wrap { width: 100%; }
      .contacts { align-self: flex-end; }
    }

    @media (max-width: 40rem) {
      body { place-items: start center; padding: 1rem; }
      .glass { min-height: calc(100svh - 2rem); border-radius: 1.5rem; }
      .brand-label { display: none; }
      .hero { padding-top: 4.75rem; }
      h1 { font-size: clamp(3.25rem, 17vw, 4rem); }
      .lower { padding-top: 4.5rem; }
      .recommendation { align-items: flex-start; gap: 0.875rem; padding: 1rem; }
      .play { width: 2.5rem; height: 2.5rem; }
      .recommendation-note { font-size: 0.75rem; }
      .arrow { width: 1.25rem; flex-basis: 1.25rem; }
      .contacts { align-self: flex-start; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="gradient-field" aria-hidden="true">
    <div class="current current--cobalt"></div>
    <div class="current current--mint"></div>
  </div>

  <main class="glass" aria-labelledby="name">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Evan Rose home">
        <span class="brand-mark" aria-hidden="true">ER</span>
        <span class="brand-label">evanrose.com</span>
      </a>

      <div class="controls" aria-label="Page controls">
        <button class="control" id="motion-toggle" type="button" aria-label="Pause background motion" aria-pressed="false" title="Pause background motion">
          <svg class="pause-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M7 4v16M17 4v16"/></svg>
          <svg class="play-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true" hidden><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
        </button>
        <button class="control" id="theme-toggle" type="button" aria-label="Switch to night theme" aria-pressed="false" title="Switch to night theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4"/></svg>
        </button>
      </div>
    </header>

    <section class="hero">
      <p class="eyebrow">Personal index · 2026</p>
      <h1 id="name">Evan Rose</h1>
      <p class="intro">A few things worth keeping close, plus a simple way to say hello.</p>
    </section>

    <div class="lower">
      <section class="recommendation-wrap" aria-labelledby="recommendations-heading">
        <div class="section-label">
          <span id="recommendations-heading">Recommendation</span>
          <span class="count">01 / 01</span>
        </div>
        <a class="recommendation" href="https://www.youtube.com/watch?v=0HqUYpGQIfs" target="_blank" rel="noopener noreferrer">
          <span class="play" aria-hidden="true">
            <svg viewBox="0 0 15 17" fill="none"><path d="M14 8.5 1 16V1l13 7.5Z" fill="currentColor"/></svg>
          </span>
          <span class="recommendation-copy">
            <span class="recommendation-title">Emergent Complexity</span>
            <span class="recommendation-note">“To make an apple pie from scratch, invent the universe.”</span>
          </span>
          <span class="arrow" aria-hidden="true">↗</span>
          <span class="sr-only">Opens on YouTube in a new tab</span>
        </a>
      </section>

      <nav class="contacts" aria-label="Contact and social links">
        <a class="contact-link" href="mailto:evanrose@ucla.edu">email</a>
        <a class="contact-link contact-link--round" href="https://x.com/evanr0se" target="_blank" rel="noopener noreferrer" aria-label="Evan Rose on X">X</a>
        <a class="contact-link contact-link--round" href="https://www.linkedin.com/in/evanucla/" target="_blank" rel="noopener noreferrer" aria-label="Evan Rose on LinkedIn">in</a>
      </nav>
    </div>
  </main>

  <script>
    (() => {
      const root = document.documentElement;
      const body = document.body;
      const motionButton = document.getElementById('motion-toggle');
      const themeButton = document.getElementById('theme-toggle');
      const pauseIcon = motionButton.querySelector('.pause-icon');
      const playIcon = motionButton.querySelector('.play-icon');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const storedTheme = localStorage.getItem('evanrose:theme');
      let frame = 0;

      function setTheme(theme) {
        const isNight = theme === 'night';
        body.dataset.theme = isNight ? 'night' : 'day';
        themeButton.setAttribute('aria-pressed', String(isNight));
        themeButton.setAttribute('aria-label', isNight ? 'Switch to day theme' : 'Switch to night theme');
        themeButton.title = isNight ? 'Switch to day theme' : 'Switch to night theme';
        document.querySelector('meta[name="theme-color"]').content = isNight ? '#070b17' : '#dbe9ff';
      }

      function setMotionPaused(paused) {
        body.classList.toggle('motion-paused', paused);
        motionButton.setAttribute('aria-pressed', String(paused));
        motionButton.setAttribute('aria-label', paused ? 'Play background motion' : 'Pause background motion');
        motionButton.title = paused ? 'Play background motion' : 'Pause background motion';
        pauseIcon.hidden = paused;
        playIcon.hidden = !paused;
      }

      function updatePointer(event) {
        if (reduceMotion.matches) return;
        const x = (event.clientX / window.innerWidth) * 100;
        const y = (event.clientY / window.innerHeight) * 100;
        cancelAnimationFrame(frame);
        frame = requestAnimationFrame(() => {
          root.style.setProperty('--pointer-x', `${x.toFixed(2)}%`);
          root.style.setProperty('--pointer-y', `${y.toFixed(2)}%`);
        });
      }

      setTheme(storedTheme === 'night' ? 'night' : 'day');
      setMotionPaused(reduceMotion.matches);

      window.addEventListener('pointermove', updatePointer, { passive: true });
      motionButton.addEventListener('click', () => {
        setMotionPaused(!body.classList.contains('motion-paused'));
      });
      themeButton.addEventListener('click', () => {
        const nextTheme = body.dataset.theme === 'night' ? 'day' : 'night';
        setTheme(nextTheme);
        localStorage.setItem('evanrose:theme', nextTheme);
      });
      reduceMotion.addEventListener('change', event => setMotionPaused(event.matches));
    })();
  </script>
</body>
</html>
